plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    mainClass = 'com.mymail.MailApplication'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.auth0:auth0-springboot-api:1.0.0-beta.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

def loadDotEnv = {
    def envFile = rootProject.file('.env')

    if (!envFile.exists()) {
        return [:]
    }

    envFile.readLines()
            .findAll { line ->
                def trimmed = line.trim()
                trimmed && !trimmed.startsWith('#') && trimmed.contains('=')
            }
            .collectEntries { line ->
                def index = line.indexOf('=')
                def key = line.substring(0, index).trim()
                def value = line.substring(index + 1).trim()

                if ((value.startsWith('"') && value.endsWith('"')) ||
                        (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }

                [(key): value]
            }
}

tasks.named('bootRun') {
    environment loadDotEnv()
}
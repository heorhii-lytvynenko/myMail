spring:
  application:
    name: mymail-api

  datasource:
    url: jdbc:postgresql://localhost:5432/mymail
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_API_IDENTIFIER}



services:
  postgres:
    image: postgres:17
    container_name: mymail-postgres
    environment:
      POSTGRES_DB: mymail
      POSTGRES_USER: mymail
      POSTGRES_PASSWORD: mymail_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
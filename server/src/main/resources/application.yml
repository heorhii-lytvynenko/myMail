spring:
  application:
    name: mymail-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          audiences: ${AUTH0_API_IDENTIFIER}
  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_API_IDENTIFIER}
  client-id: ${AUTH0_CLIENT_ID}
  client-secret: ${AUTH0_CLIENT_SECRET}
  connection: ${AUTH0_CONNECTION:Username-Password-Authentication}


google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    enabled: ${GOOGLE_INTEGRATION_ENABLED:false}
    allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:https://my-mail-front.vercel.app/api/integrations/google/callback}
    token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:}
server:
  forward-headers-strategy: none
  tomcat:
    accesslog:
      enabled: false
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
logging:
  level:
    org.springframework.web: INFO
    org.springframework.web.client: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

resend:
  api-key: ${RESEND_API_KEY}

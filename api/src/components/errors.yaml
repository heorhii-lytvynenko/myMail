BadRequest:
  description: Bad Request
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

Unauthorized:
  description: Unauthorized
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

Forbidden:
  description: Forbidden
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

NotFound:
  description: Not Found
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

Conflict:
  description: Conflict
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

UnprocessableEntity:
  description: Unprocessable Entity
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

UnsupportedMediaType:
  description: Unsupported Media Type
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

InternalServerError:
  description: Internal Server Error
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

TooManyRequests:
  description: Rate limit exceeded.
  headers:
    Retry-After:
      schema:
        type: integer
        minimum: 1
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

ServiceFailure:
  description: Upstream or backend service unavailable; no provider details exposed.
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ErrorDto'

BadRequest:
  description: Validation rejected or invalid/expired/replayed OAuth transaction.
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApiError'
Unauthorized:
  description: Missing, invalid, expired, or revoked application session.
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApiError'
Forbidden:
  description: Authenticated identity denied access or transaction ownership mismatch.
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApiError'
NotFound:
  description: Resource not found.
Conflict:
  description: Duplicate account or pending disconnect.
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApiError'
TooManyRequests:
  description: Rate limit exceeded.
  headers:
    Retry-After:
      schema:
        type: integer
        minimum: 1
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApiError'
ServiceFailure:
  description: Upstream or backend service unavailable; no provider details exposed.
  headers:
    Cache-Control:
      schema:
        type: string
        enum: [no-store]
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApiError'

Page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0

Size:
  name: size
  in: query
  required: false
  description: Page size. Values above 100 are capped to 100 by the application.
  schema:
    type: integer
    format: int32
    minimum: 1
    default: 20

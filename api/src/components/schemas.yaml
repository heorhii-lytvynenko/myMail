EmailMessageList:
  type: array
  items:
    $ref: '#/EmailMessage'

EmailMessage:
  type: object
  required:
    - id
    - subject
  properties:
    id:
      type: string
    threadId:
      type: string
    from:
      type: string
    to:
      type: string
    subject:
      type: string
    body:
      type: string
    receivedAt:
      type: string
      format: date-time
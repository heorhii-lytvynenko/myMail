EmailMessageList:
  type: array
  items:
    $ref: './schemas.yaml#/EmailMessage'

EmailMessage:
  type: object
  required:
    - id
    - subject
  properties:
    id:
      type: string
    threadId:
      type: string
    from:
      type: string
    to:
      type: string
    subject:
      type: string
    body:
      type: string
    receivedAt:
      type: string
      format: date-time
ApiError:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
    message:
      type: string

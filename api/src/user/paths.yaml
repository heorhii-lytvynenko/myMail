
user:
  get:
    tags:
      - Users
    summary: Get current authenticated user
    operationId: getCurrentUser
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current authenticated user
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/UserResponse'
      '401':
        $ref: '../components/errors.yaml#/Unauthorized'

login:
  post:
    tags:
      - Authentication
    summary: Authenticate user
    operationId: login
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/LoginRequest'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/LoginResponse'
      '401':
        $ref: '../components/errors.yaml#/Unauthorized'

signIn:
  post:
    tags:
      - Authentication
    operationId: signIn
    summary: Register new user
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/SignInRequest'
    responses:
      '201':
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/SignInResponse'
      '409':
        description: User already exists

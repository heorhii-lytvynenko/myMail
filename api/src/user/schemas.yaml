UserResponse:
  type: object
  required:
    - idpId
    - email
  properties:
    idpId:
      type: string
      minLength: 1
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 254

LoginResponse:
  type: object
  required:
    - accessToken
    - tokenType
  properties:
    accessToken:
      type: string
      description: Verified application JWT
    tokenType:
      type: string
      pattern: '^Bearer$'
    expiresIn:
      type: integer
      format: int64
      minimum: 1
      description: Actual remaining lifetime bounded by verified JWT exp and Auth0 expires_in.

SignInResponse:
  type: object
  required:
    - idpId
    - accessToken
    - tokenType
  properties:
    idpId:
      type: string
      minLength: 1
      description: Auth0 user identifier
      example: auth0|123
    accessToken:
      type: string
      description: Verified application JWT
    tokenType:
      type: string
      pattern: '^Bearer$'
    expiresIn:
      type: integer
      format: int64
      minimum: 1
      description: Actual remaining lifetime bounded by verified JWT exp and Auth0 expires_in.

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 1

SignInRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 8


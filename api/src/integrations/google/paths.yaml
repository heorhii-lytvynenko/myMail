authorize:
  post:
    tags: [Google Integration]
    operationId: authorizeGoogle
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/GoogleAuthorizeRequest'
    responses:
      '200':
        description: Success; Cache-Control no-store.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/GoogleAuthorizationResponse'
      '400':
        $ref: '../../components/errors.yaml#/BadRequest'
      '401':
        $ref: '../../components/errors.yaml#/Unauthorized'
      '403':
        $ref: '../../components/errors.yaml#/Forbidden'
      '409':
        $ref: '../../components/errors.yaml#/Conflict'
      '429':
        $ref: '../../components/errors.yaml#/TooManyRequests'
      '502':
        $ref: '../../components/errors.yaml#/ServiceFailure'
      '503':
        $ref: '../../components/errors.yaml#/ServiceFailure'

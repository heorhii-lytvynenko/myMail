GoogleAuthorizeRequest:
  type: object
  additionalProperties: false
  required: [redirectUri, codeChallenge, codeChallengeMethod]
  properties:
    redirectUri:
      type: string
      maxLength: 512
      description: Exact configured allowlist entry; no wildcards.
    codeChallenge:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    codeChallengeMethod:
      type: string
      enum: [S256]
GoogleAuthorizationResponse:
  type: object
  required: [authorizationUrl, state, expiresIn]
  properties:
    authorizationUrl:
      type: string
      format: uri
    state:
      type: string
      pattern: '^[A-Za-z0-9_-]{43,128}$'
    expiresIn:
      type: integer
      minimum: 1
      maximum: 600
GoogleCompleteRequest:
  type: object
  additionalProperties: false
  required: [code, state, codeVerifier, redirectUri]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 4096
      writeOnly: true
    state:
      type: string
      pattern: '^[A-Za-z0-9_-]{43,128}$'
    codeVerifier:
      type: string
      pattern: '^[A-Za-z0-9_-]{43,128}$'
      writeOnly: true
    redirectUri:
      type: string
      maxLength: 512
GoogleConnectionResponse:
  type: object
  x-class-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
  additionalProperties: false
  required: [status]
  properties:
    status:
      type: string
      enum: [connected, disconnected, reconnect_required]
    email:
      type: string
      format: email
    scopes:
      type: array
      maxItems: 1
      items:
        type: string
        pattern: '^https://www[.]googleapis[.]com/auth/gmail[.]readonly$'

openapi: 3.0.3

info:
  title: myMail API
  version: 0.1.0

servers:
  - url: https://mymail.fly.dev
  - url: http://localhost:8080

paths:
  /api/authentication/login:
    $ref: './user/paths.yaml#/login'
  /api/authentication/logout:
    $ref: './user/paths.yaml#/logout'
  /api/authentication/signIn:
    $ref: './user/paths.yaml#/signIn'

  /api/users/me:
    $ref: './user/paths.yaml#/user'
  /integrations/google/authorize:
    $ref: './integrations/google/paths.yaml#/authorize'
  /integrations/google/complete:
    $ref: './integrations/google/paths.yaml#/complete'
  /integrations/google/status:
    $ref: './integrations/google/paths.yaml#/status'
  /integrations/google:
    $ref: './integrations/google/paths.yaml#/disconnect'
  /integrations/google/callback:
    $ref: './integrations/google/paths.yaml#/callback'
  /integrations/google/connect:
    $ref: './integrations/google/paths.yaml#/connect'

#
  /integrations/google/emails:
    $ref: './integrations/google/email/paths.yaml#/email'

#  /api/email:
#    $ref: './email/paths.yaml#/email'
components:
  schemas:
    ErrorDto:
      $ref: './components/schemas.yaml#/ErrorDto'
    UserResponse:
      $ref: './user/schemas.yaml#/UserResponse'
    BaseListItemResponse:
      $ref: './components/schemas.yaml#/BaseListItemResponse'
    EmailResponse:
      $ref: './components/schemas.yaml#/EmailResponse'
    PageResponse:
      $ref: './components/schemas.yaml#/PageResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

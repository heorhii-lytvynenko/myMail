openapi: 3.0.3

info:
  title: myMail API
  version: 0.1.0

servers:
  - url: http://localhost:8080

paths:
  /api/authentication/login:
    $ref: './user/paths.yaml#/login'
  /api/authentication/signIn:
    $ref: './user/paths.yaml#/signIn'

  /api/users/me:
    $ref: './user/paths.yaml#/user'
  /integrations/google/callback:
    $ref: './integrations/google/paths.yaml#/callback'
  /integrations/google/connect:
    $ref: './integrations/google/paths.yaml#/connect'
  /integrations/google/emails:
    $ref: './integrations/google/paths.yaml#/emails'

components:
  schemas:
    UserResponse:
      $ref: './user/schemas.yaml#/UserResponse'
    EmailMessage:
      $ref: './components/schemas.yaml#/EmailMessage'
    UnauthorizedError:
      $ref: './components/errors.yaml#/Unauthorized'
    ForbiddenError:
      $ref: './components/errors.yaml#/Forbidden'
    NotFoundError:
      $ref: './components/errors.yaml#/NotFound'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT